# Minimal self-hosted Supabase: just enough for Spielzettel.
#
# Spielzettel has no accounts and no file storage, so this deliberately
# skips GoTrue (auth), Storage, imgproxy, Studio, Supavisor, and the
# Logflare/Vector analytics pipeline — the parts of the official
# docker-compose that eat the most memory. What's left:
#
#   db        Postgres (supabase/postgres: ships the anon/authenticator
#             roles and RLS plumbing the migrations expect)
#   db-init   one-shot: sets the authenticator password and creates the
#             schema + publication Realtime and the migrations need
#   rest      PostgREST — serves /rest/v1, verifies the JWT, maps its
#             `role` claim onto the Postgres role that RLS checks
#   realtime  the websocket change feed behind use-realtime-game.ts
#   caddy     routes both under one origin (supabase-js needs a single
#             host serving /rest/v1 and /realtime/v1)
#
# EVERYTHING IS INLINE ON PURPOSE — no bind mounts, no files next to this
# one. Coolify (and other platforms that run `docker compose` from a
# helper container) materialize only the compose file on the host, so a
# relative bind mount silently becomes an empty directory: Postgres skips
# the init scripts without complaining and Caddy dies mounting a directory
# onto a file. Keep this file standalone.
#
# Version pins track the official supabase/docker compose file. Bump them
# together, not individually:
# https://github.com/supabase/supabase/blob/master/docker/docker-compose.yml
#
# Setup: see README.md in this folder.

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PORT: "5432"
      PGPORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: "3600"
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal # keeps Realtime's polling queries out of the logs
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Runs to completion before rest/realtime are allowed to start. Doing this
  # here rather than in /docker-entrypoint-initdb.d also means it re-applies
  # on an existing volume — those scripts only ever run on a fresh one.
  db-init:
    image: supabase/postgres:17.6.1.136
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      # supabase_admin, not postgres: in this image `postgres` is not a
      # superuser, and `authenticator` is a reserved role only a superuser
      # may alter. The official stack sidesteps this by running its
      # roles.sql during initdb, as the bootstrap superuser.
      PGUSER: supabase_admin
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        # The image creates `authenticator` but leaves its password unset, so
        # PostgREST cannot log in until this runs. -v + :'pw' lets psql do the
        # quoting, so odd characters in the password are safe — but psql only
        # interpolates variables in input it reads, never in a -c string.
        psql -v ON_ERROR_STOP=1 -v pw="$$PGPASSWORD" <<'SQL'
        alter user authenticator with password :'pw';
        -- Realtime connects with `SET search_path TO _realtime` but does not
        -- create the schema itself.
        create schema if not exists _realtime;
        alter schema _realtime owner to supabase_admin;
        SQL
        # supabase/migrations/*.sql do `alter publication supabase_realtime
        # add table ...`, which needs the publication to exist first.
        # CREATE PUBLICATION has no IF NOT EXISTS, hence the check.
        psql -tAc "select 1 from pg_publication where pubname='supabase_realtime'" \
          | grep -q 1 \
          || psql -v ON_ERROR_STOP=1 -c "create publication supabase_realtime"
        echo "db-init: ok"

  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      # libpq keyword/value form, NOT a URI. `openssl rand -base64` can emit
      # '/' and '+', and a '/' inside a URI's userinfo breaks parsing —
      # libpq then falls back to the OS user and dies with "could not look
      # up local user ID 1000", while the container still looks healthy
      # because PostgREST just retries forever.
      PGRST_DB_URI: "host=db port=5432 user=authenticator password=${POSTGRES_PASSWORD} dbname=postgres"
      PGRST_DB_SCHEMAS: public
      # Deliberately NOT setting PGRST_DB_ANON_ROLE. The official stack sets
      # it to `anon` and relies on Kong's key-auth to turn away requests with
      # no apikey; there's no Kong here, and with the fallback in place a
      # keyless curl would be served as `anon` — which the RLS policies grant
      # everything to. Unset, PostgREST answers 401 unless a valid JWT is
      # present, and the role still comes from that JWT's `role` claim.
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  realtime:
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      # Seeds a single tenant with external_id "realtime-dev". Realtime
      # picks the tenant from the first label of the Host header, which is
      # why the Caddy config below rewrites Host on the way through.
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - rest
      - realtime
    # Config is written at start-up instead of mounted; see the note at the
    # top of this file.
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'CADDYFILE'
        {
        	auto_https off
        	admin off
        }

        :8000 {
        	# PostgREST. supabase-js sends the anon key as both `apikey` and
        	# `Authorization: Bearer`; PostgREST reads the latter, verifies it
        	# against JWT_SECRET and switches to the role in the `role` claim,
        	# which is what the RLS policies in supabase/migrations grant to.
        	handle_path /rest/v1/* {
        		header {
        			defer
        			Access-Control-Allow-Origin "*"
        			Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS, HEAD"
        			Access-Control-Allow-Headers "authorization, apikey, content-type, accept, accept-profile, content-profile, prefer, range, x-client-info"
        			Access-Control-Expose-Headers "content-range, content-profile"
        			Access-Control-Max-Age "86400"
        		}

        		@preflight method OPTIONS
        		respond @preflight 204

        		reverse_proxy rest:3000
        	}

        	# Realtime. supabase-js opens
        	# wss://<host>/realtime/v1/websocket?apikey=… and Realtime serves
        	# that under /socket, so the prefix is swapped here.
        	#
        	# The Host rewrite is load-bearing: Realtime derives the tenant id
        	# from the first label of the Host header, and SEED_SELF_HOST seeds
        	# exactly one tenant named "realtime-dev". Forwarding the public
        	# hostname makes it look up a tenant named "supabase" and reject
        	# every connection. Caddy preserves the incoming Host by default,
        	# so this has to be set explicitly.
        	handle_path /realtime/v1/* {
        		rewrite * /socket{uri}
        		reverse_proxy realtime:4000 {
        			header_up Host realtime-dev.supabase-realtime
        		}
        	}

        	respond "supabase-lite" 404
        }
        CADDYFILE
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    # Only this service faces the outside world. Point the Coolify domain
    # at port 8000; Traefik terminates TLS in front of it. db/rest/realtime
    # publish nothing and stay on the internal network.
    expose:
      - "8000"

volumes:
  db-data:
  db-config:
